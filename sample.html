<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Soham Production - Moving Home Concept</title>
    <!-- Tailwind CSS CDN for easy styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap');
        body {
            font-family: 'Inter', sans-serif;
        }
        .header-bg {
            background-color: #fcfcfc;
        }
        .nav-link {
            transition: color 0.3s ease;
        }
        .nav-link:hover {
            color: #f59e0b; /* Yellow-orange color */
        }
        .hero-wave-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
        }
    </style>
    <!-- Font Awesome for social icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.1.1/css/all.min.css">
</head>
<body class="bg-gray-100">

    <header class="header-bg relative">
        <!-- Top Navigation Bar -->
        <nav class="container mx-auto px-6 py-4 flex items-center justify-between z-20 relative">
            <!-- Company Logo -->
            <a href="#" class="flex items-center space-x-2">
                <div class="bg-amber-400 text-gray-800 font-bold px-4 py-2 rounded-lg shadow-md">
                    COMPANY LOGO
                </div>
            </a>

            <!-- Desktop Navigation Links -->
            <div class="hidden md:flex flex-grow justify-center items-center space-x-8 text-gray-800 font-medium">
                <a href="#home" class="nav-link">HOME</a>
                <a href="#services" class="nav-link">SERVICES</a>
                <a href="#about" class="nav-link">ABOUT US</a>
                <a href="#contact" class="nav-link">CONTACT</a>
            </div>

            <!-- Social Media Icons (Desktop) -->
            <div class="hidden md:flex items-center space-x-4 text-gray-600">
                <a href="#" class="hover:text-amber-500"><i class="fab fa-instagram"></i></a>
                <a href="#" class="hover:text-amber-500"><i class="fab fa-facebook-f"></i></a>
                <a href="#" class="hover:text-amber-500"><i class="fab fa-twitter"></i></a>
            </div>
            
            <!-- Hamburger Menu for Mobile -->
            <div class="md:hidden flex items-center space-x-4">
                <a href="#" class="hover:text-amber-500"><i class="fab fa-instagram"></i></a>
                <button id="hamburger-menu" class="text-gray-800 focus:outline-none">
                    <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16m-7 6h7"></path>
                    </svg>
                </button>
            </div>
        </nav>

        <!-- Mobile Navigation Menu (Hidden by default) -->
        <div id="mobile-menu" class="hidden md:hidden bg-white text-gray-800 shadow-lg px-6 py-4">
            <a href="#home" class="block py-2 text-center hover:bg-gray-100 rounded-md">HOME</a>
            <a href="#services" class="block py-2 text-center hover:bg-gray-100 rounded-md">SERVICES</a>
            <a href="#about" class="block py-2 text-center hover:bg-gray-100 rounded-md">ABOUT US</a>
            <a href="#contact" class="block py-2 text-center hover:bg-gray-100 rounded-md">CONTACT</a>
        </div>
        
        <!-- Hero Section -->
        <div class="container mx-auto relative z-10 overflow-hidden pt-12 md:pt-24 pb-32 md:pb-48">
            <div class="flex flex-col md:flex-row items-center justify-between">
                <!-- Hero Text -->
                <div class="md:w-1/2 px-6 text-center md:text-left z-20">
                    <h1 class="text-4xl md:text-6xl font-extrabold text-gray-800 leading-tight">
                        MOVING HOME
                    </h1>
                    <p class="mt-4 text-lg md:text-xl text-gray-600">
                        We make it easy for you to find the perfect new place for your family.
                    </p>
                </div>
                <!-- Hero Image -->
                <div class="md:w-1/2 mt-10 md:mt-0 flex justify-center z-20">
                    <img src="https://placehold.co/500x350/F3F4F6/374151?text=Your+Hero+Image" alt="Placeholder hero shot" class="w-4/5 h-auto rounded-full shadow-2xl">
                </div>
            </div>
        </div>

        <!-- The curved SVG shape for the background -->
        <div class="hero-wave-container">
  <svg class="absolute top-0 left-0 w-full h-full" viewBox="0 0 1000 800" preserveAspectRatio="none">

    <!-- Define gradients -->
    <defs>
      <linearGradient id="gradient1" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#fde68a" />
        <stop offset="100%" stop-color="#fbbf24" />
      </linearGradient>

      <linearGradient id="gradient2" x1="100%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" stop-color="#fef3c7" />
        <stop offset="100%" stop-color="#facc15" />
      </linearGradient>

      <linearGradient id="gradient3" x1="0%" y1="0%" x2="100%" y2="0%">
        <stop offset="0%" stop-color="#fff7ed" />
        <stop offset="100%" stop-color="#fcd34d" />
      </linearGradient>
    </defs>

    <!-- Wave Layer 1 -->
    <path d="M0,600 Q250,650 500,600 T1000,600 L1000,800 L0,800 Z"
          fill="url(#gradient1)" 
          style="filter: drop-shadow(0 4px 10px rgba(0, 0, 0, 0.2));" />

    <!-- Wave Layer 2 -->
    <path d="M0,650 Q300,700 600,650 T1000,650 L1000,800 L0,800 Z"
          fill="url(#gradient2)" 
          style="filter: drop-shadow(0 6px 15px rgba(0, 0, 0, 0.15));" />

    <!-- Wave Layer 3 -->
    <path d="M0,700 Q250,750 500,700 T1000,700 L1000,800 L0,800 Z"
          fill="url(#gradient3)" 
          style="filter: drop-shadow(0 8px 20px rgba(0, 0, 0, 0.1));" />

  </svg>
</div>
    </header>

    <!-- Main Content for demonstration -->
    <main class="container mx-auto px-6 py-12">
        <section class="bg-white rounded-xl shadow-lg p-8 -mt-20 md:-mt-32 relative z-20">
            <h2 class="text-3xl font-bold text-center mb-4">Welcome to Our Website!</h2>
            <p class="text-gray-600 text-center">This is where the rest of your content will go.</p>
        </section>
    </main>

    <!-- Simple JavaScript for the mobile hamburger menu -->
    <script>
        document.getElementById('hamburger-menu').addEventListener('click', function() {
            const mobileMenu = document.getElementById('mobile-menu');
            mobileMenu.classList.toggle('hidden');
        });
    </script>
</body>
</html>
